<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE VAULT — ▲</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#040602;--gold:#ffd600;--dim:#827717;--red:#ff4d4d;--text:#d8d0a8}
    body{background:var(--bg);color:var(--text);font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;overflow-x:hidden;text-align:center}
    .scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,214,0,.03)0,rgba(255,214,0,.03)1px,transparent 1px,transparent 3px);z-index:1}
    .glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 65%,rgba(255,90,20,.16),transparent 60%);z-index:0}
    .card{position:relative;z-index:2;max-width:560px;width:100%;margin:2rem 0}
    h1{color:var(--gold);font-size:1.3rem;letter-spacing:6px;margin-bottom:.3rem}
    .sub{color:var(--dim);letter-spacing:3px;font-size:.72rem;margin-bottom:1.2rem}
    p{font-size:.86rem;line-height:1.7;margin:.6rem 0}
    .gold{color:var(--gold)}.dim{color:var(--dim)}
    .row{display:flex;gap:.5rem;margin-top:1.3rem;flex-wrap:wrap}
    input{flex:1;min-width:200px;background:#0a0900;border:1px solid rgba(255,214,0,.35);border-radius:4px;color:var(--gold);font-family:monospace;font-size:.9rem;letter-spacing:3px;padding:.6rem .8rem;text-transform:uppercase}
    input:focus{outline:none;border-color:var(--gold)}
    button{background:transparent;border:1px solid var(--gold);border-radius:5px;color:var(--gold);font-family:monospace;letter-spacing:2px;font-size:.82rem;padding:.65rem 1.3rem;cursor:pointer;transition:.2s}
    button:hover{background:rgba(255,214,0,.1)}
    #msg{margin-top:1rem;font-size:.8rem;min-height:1.2em;letter-spacing:1px}
    #badge2{width:min(86vw,420px);height:auto;border-radius:10px;margin:1.2rem auto;display:block;box-shadow:0 0 40px rgba(255,122,60,.2)}
    .btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
    a{color:var(--dim);text-decoration:none;letter-spacing:2px;font-size:.75rem}a:hover{color:var(--gold)}
  </style>
</head>
<body>
  <div class="glow"></div><div class="scan"></div>
  <div class="card" id="door">
    <h1>▲ THE VAULT</h1>
    <div class="sub">VOLCANO PROTOCOL · FINAL DOOR</div>
    <p class="dim">This vault is not guarded by a password check. It is <span class="gold">encrypted</span>. The right phrase is the only thing that turns these bytes into anything at all. Eleven shards, in order.</p>
    <div class="row">
      <input id="phrase" placeholder="THE PHRASE" autocomplete="off" spellcheck="false" aria-label="Enter the assembled phrase" />
      <button id="go">DECRYPT</button>
    </div>
    <div id="msg" class="dim"></div>
    <p style="margin-top:1.4rem"><a href="/protocol">← back to the terminal</a></p>
  </div>
  <div class="card" id="stage" style="display:none"></div>

    function reveal(p){
      return VP.open(p,BLOB).then(function(j){
        var d=JSON.parse(j);
        sessionStorage.setItem('vp_phrase',p);
        document.getElementById('door').style.display='none';
        var st=document.getElementById('stage');st.style.display='block';st.innerHTML=d.html;
        (new Function(d.js))();
      });
    }
    function attempt(){
      var p=VP.norm(inp.value);
      msg.className='dim';msg.textContent='deriving key…';
      reveal(p).catch(function(){msg.className='';msg.style.color='#ff4d4d';msg.textContent='THE BYTES STAY BYTES. Wrong phrase, or a shard is missing.';});
    }
    document.getElementById('go').addEventListener('click',attempt);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
    var saved=sessionStorage.getItem('vp_phrase');
    if(saved)reveal(saved).catch(function(){});
    console.log('%cEncrypted with AES-256-GCM. PBKDF2, 600k rounds. There is no check to bypass — only a key to earn.','color:#827717;font-family:monospace');
