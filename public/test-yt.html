<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="styles.css" />
<style>
body { background: #050813; padding: 2rem; color: white; font-family: sans-serif; }
.hero-panel { width: 400px; }
.hero-avatar { width: 80px; height: 80px; } /* test bigger picture */
</style>
</head>
<body>
<div class="hero-panel">
  <div class="hero-panel-label">Current Status</div>
  <div class="hero-panel-row">
    <div class="hero-panel-ident">
      <img src="assets/me.png" alt="Portrait of Jacob P Harris" class="hero-avatar" loading="lazy" />
      <div class="hero-panel-name">Jacob P Harris</div>
    </div>
    <div class="hero-panel-badge">Portfolio · v0.1</div>
  </div>
  <div class="hero-panel-tags">
    <span class="chip chip-hot">Developer</span>
    <span class="chip">Cyber security</span>
    <span class="chip">Linux user</span>
    <span class="chip">Mycology side quests</span>
  </div>
  <div class="hero-panel-divider"></div>
  <dl class="hero-panel-meta">
    <div>
      <dt class="label">Primary stack</dt>
      <dd class="value">Linux · Web · Security</dd>
    </div>
    <div>
      <dt class="label">Focus</dt>
      <dd class="value">Dev, infra, hardening</dd>
    </div>
    <div>
      <dt class="label">Status</dt>
      <dd class="value">Building</dd>
    </div>
  </dl>

  <div style="margin-top: 1rem; margin-bottom: 0.5rem; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Latest Videos</div>
  <div class="embed-frame embed-16x9" style="margin-top: 0; max-height: 180px;">
    <iframe src="https://www.youtube.com/embed/videoseries?list=PLZG0CvngYU9ihzPO2JTRe17DQDUI0Z6vC" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </div>

  <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
    <a href="https://github.com/Hackatoan" class="pill-link" target="_blank">GitHub</a>
    <a href="https://www.youtube.com/@Hackatoa" class="pill-link" target="_blank">YouTube</a>
    <a href="https://www.twitch.tv/hackatoa" class="pill-link" target="_blank">Twitch</a>
  </div>

  <div class="hero-panel-footer">
    <div>
      <span class="dot"></span>
      <span>Dynamic bits will grow over time.</span>
    </div>
  </div>
</div>
</body>
</html>
