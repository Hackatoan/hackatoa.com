server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (sitewide) — matches firebase.json's "**" header block
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://alexgama11.github.io https://www.youtube.com https://s.ytimg.com https://pagead2.googlesyndication.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://alexgama11.github.io; img-src 'self' blob: data: https://api.qrserver.com https://www.buymeacoffee.com; media-src 'self' blob: https://records.hackatoa.com; frame-src https://player.twitch.tv https://www.youtube.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cloudflareinsights.com; upgrade-insecure-requests;" always;

    # 301 redirect — matches firebase.json "redirects"
    location = /wayback-machine {
        return 301 /songs/;
    }

    # Internal rewrites — URL stays the same, index.html's JS router reads the path.
    # Matches firebase.json "rewrites".
    location = /about    { rewrite ^ /index.html last; }
    location = /connect  { rewrite ^ /index.html last; }
    location = /support  { rewrite ^ /index.html last; }
    location /projects/  { rewrite ^ /index.html last; }

    # motd.json must never be cached. nginx does NOT inherit server-level add_header
    # into a location that sets its own, so the security headers are repeated here.
    location = /motd.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://alexgama11.github.io https://www.youtube.com https://s.ytimg.com https://pagead2.googlesyndication.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://alexgama11.github.io; img-src 'self' blob: data: https://api.qrserver.com https://www.buymeacoffee.com; media-src 'self' blob: https://records.hackatoa.com; frame-src https://player.twitch.tv https://www.youtube.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cloudflareinsights.com; upgrade-insecure-requests;" always;
    }

    # Static assets — Firebase Hosting cached these by default; self-hosting nginx doesn't
    # unless told to. No content hashing in filenames here, so keep this well short of
    # "immutable" (30d) rather than 1y, to avoid serving stale assets after a real update.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf|otf|mp3|mp4)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://alexgama11.github.io https://www.youtube.com https://s.ytimg.com https://pagead2.googlesyndication.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://alexgama11.github.io; img-src 'self' blob: data: https://api.qrserver.com https://www.buymeacoffee.com; media-src 'self' blob: https://records.hackatoa.com; frame-src https://player.twitch.tv https://www.youtube.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cloudflareinsights.com; upgrade-insecure-requests;" always;
        try_files $uri =404;
    }

    # Clean URLs (cleanUrls: true) — /resume -> resume/index.html, /scroll-preview -> scroll-preview.html
    # $uri/index.html is checked as an explicit file (not a directory) so nginx serves it
    # directly with a 200 — otherwise nginx's default directory handling 301-redirects
    # /resume -> /resume/ first, which Firebase Hosting never did.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
}
