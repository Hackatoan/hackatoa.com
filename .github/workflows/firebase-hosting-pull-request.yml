# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Firebase credentials
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HACKATOA_COM }}
        run: |
          echo "$SA_KEY" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Deploy preview to Firebase Hosting
        run: |
          channel="pr${{ github.event.number }}"
          output=$(npx firebase-tools hosting:channel:deploy "$channel" --non-interactive 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "is the current active version"; then
            echo "Version already live on preview channel — treating as success"
            exit 0
          fi
          exit $exit_code
