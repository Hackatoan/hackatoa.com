name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - Main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write deploy status.json
        run: |
          BUILD="$(git rev-parse --short HEAD)"
          STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > public/status.json << EOF
          {
            "build": "${BUILD}",
            "started": "${STARTED}"
          }
          EOF

      - name: Set up Firebase credentials
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HACKATOA_COM }}
        run: |
          echo "$SA_KEY" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Deploy to Firebase Hosting
        run: |
          output=$(npx firebase-tools deploy --only hosting --non-interactive 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "is the current active version"; then
            echo "Version already live — no-op deploy, treating as success"
            exit 0
          fi
          exit $exit_code